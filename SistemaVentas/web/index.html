<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Inicio - Gestión de Ventas Sileliz</title>
    <link rel="icon" href="img/favicon-32.png" sizes="32x32" type="image/png">
    <link rel="icon" href="img/favicon-192.png" sizes="192x192" type="image/png">
    <link rel="stylesheet" href="lib/bootstrap/bootstrap.min.css">
    <link rel="stylesheet" href="css/estilos.css">
</head>
<body>
    <header>
        <h1>Sistema de Ventas - Sileliz</h1>
        <nav>
            <ul>
                <!-- layout.js arma el menú según el rol -->
            </ul>
        </nav>
    </header>

    <main id="contenido-principal">
        <h2 id="saludo">Inicio</h2>
        <p class="text-muted" id="fecha-resumen">Resumen del día</p>

        <p id="mensaje" class="alert alert-danger" role="alert" hidden></p>

        <section class="row row-cols-1 row-cols-sm-2 row-cols-lg-4 g-3 mb-4" aria-label="Resumen del día">
            <div class="col">
                <div class="card h-100 text-center">
                    <div class="card-body">
                        <p class="card-subtitle text-muted mb-2">Ventas de hoy</p>
                        <p class="display-6 mb-1" id="valor-ventas">-</p>
                        <p class="small text-muted mb-0" id="nota-anuladas"></p>
                    </div>
                </div>
            </div>
            <div class="col">
                <div class="card h-100 text-center">
                    <div class="card-body">
                        <p class="card-subtitle text-muted mb-2">Total vendido hoy</p>
                        <p class="display-6 mb-0" id="valor-total">-</p>
                    </div>
                </div>
            </div>
            <div class="col">
                <div class="card h-100 text-center">
                    <div class="card-body">
                        <p class="card-subtitle text-muted mb-2">Clientes activos</p>
                        <p class="display-6 mb-0" id="valor-clientes">-</p>
                    </div>
                </div>
            </div>
            <div class="col">
                <div class="card h-100 text-center">
                    <div class="card-body">
                        <p class="card-subtitle text-muted mb-2">Prendas con stock bajo</p>
                        <p class="display-6 mb-1" id="valor-stock">-</p>
                        <a href="productos.html" id="enlace-stock" class="small" hidden>Ver productos</a>
                    </div>
                </div>
            </div>
        </section>

        <section aria-label="Accesos rápidos">
            <h3 class="h5">Accesos rápidos</h3>
            <div class="d-flex flex-wrap gap-2">
                <a href="venta-nueva.html" class="btn btn-dark">Nueva venta</a>
                <a href="ventas.html" class="btn btn-outline-dark">Ventas realizadas</a>
                <a href="productos.html" class="btn btn-outline-dark">Productos</a>
                <a href="clientes.html" class="btn btn-outline-dark">Clientes</a>
                <a href="reportes.html" id="acceso-reportes" class="btn btn-outline-dark" hidden>Reportes</a>
            </div>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 Sistema Ventas - Sileliz</p>
    </footer>

    <script src="lib/bootstrap/bootstrap.bundle.min.js"></script>
    <script src="js/api.js"></script>
    <script src="js/layout.js"></script>
    <script src="js/index.js"></script>
</body>
</html>
