<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Clientes - Gestión de Ventas Sileliz</title>
    <link rel="icon" href="img/favicon-32.png" sizes="32x32" type="image/png">
    <link rel="icon" href="img/favicon-192.png" sizes="192x192" type="image/png">
    <link rel="stylesheet" href="lib/bootstrap/bootstrap.min.css">
    <link rel="stylesheet" href="css/estilos.css">
</head>
<body>
    <header>
        <h1>Sistema de Ventas - Sileliz</h1>
        <nav>
            <ul>
                <!-- layout.js arma el menú según el rol -->
            </ul>
        </nav>
    </header>

    <main id="contenido-principal">
        <h2>Gestión de Clientes</h2>
        <div id="mensaje-error" class="alert alert-danger d-none" role="alert"></div>

        <!-- Buscador -->
        <div class="row g-2 mb-3">
            <div class="col-12 col-md-6">
                <input type="text" id="txtBuscar" class="form-control" placeholder="Buscar por nombre o DNI...">
            </div>
            <div class="col-6 col-md-2">
                <button type="button" class="btn btn-primary w-100" onclick="buscarClientes()">Buscar</button>
            </div>
            <div class="col-6 col-md-4 text-end">
                <button type="button" class="btn btn-success" onclick="mostrarFormulario()">+ Nuevo cliente</button>
            </div>
        </div>

        <!-- Tabla de clientes -->
        <div class="table-responsive">
            <table class="table table-striped align-middle" id="tablaClientes">
                <thead>
                    <tr>
                        <th>DNI</th>
                        <th>Nombres</th>
                        <th>Teléfono</th>
                        <th>Acciones</th>
                    </tr>
                </thead>
                <tbody></tbody>
            </table>
        </div>

        <!-- Paginación -->
        <div id="paginacion" class="d-flex justify-content-center mt-3"></div>
    </main>

    <footer>
        <p>&copy; 2026 Sistema Ventas - Sileliz</p>
    </footer>

    <!-- Scripts del proyecto -->
    <script src="lib/bootstrap/bootstrap.bundle.min.js"></script>
    <script src="js/api.js"></script>
    <script src="js/layout.js"></script>
    <script src="js/clientes.js"></script>
</body>
</html>
