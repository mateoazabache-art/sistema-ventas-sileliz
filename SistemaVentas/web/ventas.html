<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ventas realizadas · Sileliz.mas</title>
  <link rel="icon" href="img/favicon-32.png" sizes="32x32" type="image/png">
  <link rel="icon" href="img/favicon-192.png" sizes="192x192" type="image/png">
  <link rel="stylesheet" href="lib/bootstrap/bootstrap.min.css">
  <link rel="stylesheet" href="css/estilos.css">
  <link rel="stylesheet" href="css/ventas.css">
</head>
<body>
  <header><h1>Sileliz.mas</h1><nav><ul></ul></nav></header>

  <main class="container my-4">
    <h2 class="h4 mb-3">Ventas realizadas</h2>

    <div class="row g-2 mb-3">
      <div class="col-6 col-md-3">
        <label for="desde" class="form-label">Desde</label>
        <input type="date" id="desde" class="form-control">
      </div>
      <div class="col-6 col-md-3">
        <label for="hasta" class="form-label">Hasta</label>
        <input type="date" id="hasta" class="form-control">
      </div>
      <div class="col-12 col-md-3 d-flex align-items-end">
        <button type="button" id="btnBuscar" class="btn btn-primary w-100">Buscar</button>
      </div>
    </div>

    <div id="mensaje" class="alert d-none" role="alert"></div>

    <div class="table-responsive">
      <table class="table table-striped align-middle">
        <thead>
          <tr>
            <th>Comprobante</th><th>Fecha</th><th>Cliente</th><th>Vendedor</th>
            <th>Método</th><th class="text-end">Total</th><th>Estado</th><th>Acciones</th>
          </tr>
        </thead>
        <tbody id="tbodyVentas"></tbody>
      </table>
    </div>

    <nav class="d-flex justify-content-between align-items-center">
      <button type="button" id="btnAnterior" class="btn btn-outline-secondary">Anterior</button>
      <span id="infoPagina">Página 1 de 1</span>
      <button type="button" id="btnSiguiente" class="btn btn-outline-secondary">Siguiente</button>
    </nav>
  </main>

  <script src="lib/bootstrap/bootstrap.bundle.min.js"></script>
  <script src="js/api.js"></script>
  <script src="js/layout.js"></script>
  <script src="js/ventas.js"></script>
</body>
</html>
